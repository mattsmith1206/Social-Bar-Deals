<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Social — Bar deals near UGA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍻</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand-row">
      <div>
        <h1 class="brand">Social<span class="dot">.</span></h1>
        <button class="city-btn" id="cityBtn" aria-label="Change city"><span id="cityName">Athens, GA</span> ▾</button>
      </div>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
    <nav class="seg" id="daySeg" role="tablist" aria-label="When">
      <button role="tab" data-view="tonight" class="on">Tonight</button>
      <button role="tab" data-view="tomorrow">Tomorrow</button>
      <button role="tab" data-view="week">This Week</button>
    </nav>
    <div class="chips" id="chips" aria-label="Filters"></div>
  </header>

  <main id="feed" class="feed" aria-live="polite"></main>

  <!-- Bottom sheets / overlays -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="detail" hidden aria-modal="true" role="dialog"></section>
  <section class="sheet small" id="actions" hidden aria-modal="true" role="dialog"></section>
  <section class="sheet" id="menu" hidden aria-modal="true" role="dialog"></section>
  <div class="toast" id="toast" hidden></div>

  <div class="gate" id="ageGate" hidden>
    <div class="gate-card">
      <div class="gate-emoji">🍻</div>
      <h2>Social is for 21+</h2>
      <p>We list bar and drink specials around Athens. Please confirm you're of legal drinking age.</p>
      <button class="btn primary big" id="ageYes">I'm 21 or older</button>
      <button class="btn ghost big" id="ageNo">I'm under 21</button>
      <p class="fine" id="ageNoMsg" hidden>No worries — come back when you're 21. 🎂</p>
    </div>
  </div>

  <script src="data/athens.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
